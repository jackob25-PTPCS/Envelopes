<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6D28D9" />
  <title>Connect — Envelopes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="brand">Envelopes</div>
    <p class="sub">Point this at your Envelopes server. Your budget and bank connection live there, not on this phone.</p>
    <input id="url" placeholder="budget.example.com" type="url" inputmode="url"
           spellcheck="false" autocapitalize="none" autocorrect="off" />
    <div id="msg" class="msg"></div>
    <button id="go">Connect</button>
    <p class="hint">
      On the same Wi-Fi, an address like <code>192.168.1.20:4000</code> works.
      Bare hostnames get <code>https://</code>; private addresses get <code>http://</code>.
    </p>
  </main>
  <script src="connect.js"></script>
</body>
</html>
